<!DOCTYPE html>
<html lang="ka">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https:; style-src 'unsafe-inline' https:; img-src data: blob: https:; font-src data: https:; media-src data: blob: https:">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>კალკულატორი</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #171d25;
    --key: #232b35;
    --key-hover: #2c3541;
    --key-fn: #1c232b;
    --text: #eef2f6;
    --muted: #86929f;
    --accent: #3fb37f;
    --accent-dim: #0f1a15;
    --danger: #e0685f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 0%, #1b2430 0%, var(--bg) 65%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }

  .calc {
    width: min(360px, 100%);
    padding: 18px;
    border-radius: 26px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, .05);
    box-shadow: 0 30px 70px -25px rgba(0, 0, 0, .85);
  }

  .screen {
    padding: 16px 10px 14px;
    text-align: right;
  }

  .history {
    height: 20px;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: .3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .current {
    margin-top: 6px;
    font-size: 46px;
    font-weight: 600;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    overflow-x: auto;
    white-space: nowrap;
    user-select: all;
  }

  .current.is-error {
    font-size: 26px;
    color: var(--danger);
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 12px;
  }

  button {
    height: 62px;
    border: 0;
    border-radius: 16px;
    background: var(--key);
    color: var(--text);
    font: inherit;
    font-size: 20px;
    cursor: pointer;
    transition: background .15s ease, transform .08s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button:hover { background: var(--key-hover); }
  button:active, button.active { transform: scale(.95); }

  .fn { background: var(--key-fn); color: var(--muted); font-size: 18px; }
  .fn:hover { background: var(--key-hover); color: var(--text); }

  .op { color: var(--accent); font-size: 24px; }
  .op.active-op { background: var(--accent); color: var(--accent-dim); }

  .eq { background: var(--accent); color: var(--accent-dim); font-size: 24px; font-weight: 700; }
  .eq:hover { background: #4cc48d; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main class="calc">
    <div class="screen">
      <div class="history" id="history">&nbsp;</div>
      <div class="current" id="current" aria-live="polite">0</div>
    </div>

    <div class="keys">
      <button class="fn" data-action="clear" aria-label="გასუფთავება">AC</button>
      <button class="fn" data-action="back" aria-label="ბოლო ციფრის წაშლა">⌫</button>
      <button class="fn" data-action="percent" aria-label="პროცენტი">%</button>
      <button class="op" data-op="div" aria-label="გაყოფა">÷</button>

      <button data-action="digit" data-value="7">7</button>
      <button data-action="digit" data-value="8">8</button>
      <button data-action="digit" data-value="9">9</button>
      <button class="op" data-op="mul" aria-label="გამრავლება">×</button>

      <button data-action="digit" data-value="4">4</button>
      <button data-action="digit" data-value="5">5</button>
      <button data-action="digit" data-value="6">6</button>
      <button class="op" data-op="sub" aria-label="გამოკლება">−</button>

      <button data-action="digit" data-value="1">1</button>
      <button data-action="digit" data-value="2">2</button>
      <button data-action="digit" data-value="3">3</button>
      <button class="op" data-op="add" aria-label="შეკრება">+</button>

      <button class="fn" data-action="sign" aria-label="ნიშნის შეცვლა">±</button>
      <button data-action="digit" data-value="0">0</button>
      <button data-action="dot" aria-label="ათობითი წერტილი">.</button>
      <button class="eq" data-action="equals" aria-label="ტოლი">=</button>
    </div>
  </main>

<script>
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');
  const keysEl = document.querySelector('.keys');

  const SYMBOL = { add: '+', sub: '−', mul: '×', div: '÷' };
  const MAX_DIGITS = 12;

  const state = {
    entry: '0',        // მიმდინარე რიცხვი ტექსტად
    acc: null,         // დაგროვილი შედეგი
    pendingOp: null,   // მოლოდინში მყოფი ოპერაცია
    overwrite: true,   // შემდეგი ციფრი ჩაანაცვლებს entry-ს
    operandReady: false, // entry რეალურ ოპერანდს შეიცავს
    error: false,
    lastExpr: ''
  };

  function apply(a, b, op) {
    switch (op) {
      case 'add': return a + b;
      case 'sub': return a - b;
      case 'mul': return a * b;
      case 'div': return b === 0 ? null : a / b;
    }
  }

  // მრგვალებს მცურავი წერტილის ხმაურს (0.1 + 0.2 → 0.3)
  function formatNumber(n) {
    if (!Number.isFinite(n)) return '0';
    if (n !== 0 && (Math.abs(n) >= 1e12 || Math.abs(n) < 1e-6)) {
      return String(Number(n.toPrecision(10)));
    }
    return String(Number(n.toPrecision(12)));
  }

  // ათასეულების ჯგუფებად დაყოფა ეკრანზე საჩვენებლად
  function groupDigits(s) {
    if (s.includes('e') || !/^-?\d/.test(s)) return s;
    const neg = s.startsWith('-');
    let body = neg ? s.slice(1) : s;
    const [int, dec] = body.split('.');
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
    return (neg ? '−' : '') + grouped + (dec !== undefined ? '.' + dec : '');
  }

  function render() {
    currentEl.textContent = state.error ? 'შეცდომა' : groupDigits(state.entry);
    currentEl.classList.toggle('is-error', state.error);
    historyEl.textContent = state.lastExpr || '\u00a0';
    for (const btn of keysEl.querySelectorAll('[data-op]')) {
      btn.classList.toggle(
        'active-op',
        !state.error && state.pendingOp === btn.dataset.op && state.overwrite
      );
    }
  }

  function resetAll() {
    state.entry = '0';
    state.acc = null;
    state.pendingOp = null;
    state.overwrite = true;
    state.operandReady = false;
    state.error = false;
    state.lastExpr = '';
    render();
  }

  function fail(expr) {
    state.lastExpr = expr;
    state.error = true;
    state.pendingOp = null;
    state.acc = null;
    state.overwrite = true;
    state.operandReady = false;
    render();
  }

  function digitCount(s) {
    return s.replace(/[^0-9]/g, '').length;
  }

  function inputDigit(d) {
    if (state.error) resetAll();
    if (state.overwrite) {
      state.entry = d;
      state.overwrite = false;
    } else if (state.entry === '0') {
      state.entry = d;
    } else if (state.entry === '-0') {
      state.entry = '-' + d;
    } else {
      if (digitCount(state.entry) >= MAX_DIGITS) return;
      state.entry += d;
    }
    state.operandReady = true;
    render();
  }

  function inputDot() {
    if (state.error) resetAll();
    if (state.overwrite) {
      state.entry = '0.';
      state.overwrite = false;
    } else if (!state.entry.includes('.')) {
      state.entry += '.';
    }
    state.operandReady = true;
    render();
  }

  function toggleSign() {
    if (state.error || state.entry === '0' || state.entry === '0.') return;
    state.entry = state.entry.startsWith('-') ? state.entry.slice(1) : '-' + state.entry;
    state.operandReady = true;
    render();
  }

  function backspace() {
    if (state.error) return resetAll();
    if (state.overwrite) {
      state.entry = '0';
      state.operandReady = false;
      return render();
    }
    let s = state.entry.slice(0, -1);
    if (s === '' || s === '-' || s === '-0') s = '0';
    state.entry = s;
    state.operandReady = true;
    render();
  }

  function percent() {
    if (state.error) return;
    state.entry = formatNumber(Number(state.entry) / 100);
    state.overwrite = true;
    state.operandReady = true;
    render();
  }

  function chooseOperator(op) {
    if (state.error) resetAll();
    const value = Number(state.entry);

    if (state.pendingOp !== null && state.operandReady) {
      const result = apply(state.acc, value, state.pendingOp);
      if (result === null) {
        return fail(groupDigits(formatNumber(state.acc)) + ' ' + SYMBOL[state.pendingOp] + ' 0');
      }
      state.acc = result;
      state.entry = formatNumber(result);
    } else {
      state.acc = state.pendingOp === null ? value : state.acc;
    }

    state.pendingOp = op;
    state.overwrite = true;
    state.operandReady = false;
    state.lastExpr = groupDigits(formatNumber(state.acc)) + ' ' + SYMBOL[op];
    render();
  }

  function equals() {
    if (state.error || state.pendingOp === null) return;
    const value = Number(state.entry);
    const expr = groupDigits(formatNumber(state.acc)) + ' ' + SYMBOL[state.pendingOp] +
                 ' ' + groupDigits(formatNumber(value)) + ' =';
    const result = apply(state.acc, value, state.pendingOp);
    if (result === null) return fail(expr);

    state.lastExpr = expr;
    state.entry = formatNumber(result);
    state.acc = result;
    state.pendingOp = null;
    state.overwrite = true;
    state.operandReady = true;
    render();
  }

  function act(btn) {
    if (btn.dataset.op) return chooseOperator(btn.dataset.op);
    switch (btn.dataset.action) {
      case 'digit': return inputDigit(btn.dataset.value);
      case 'dot': return inputDot();
      case 'clear': return resetAll();
      case 'back': return backspace();
      case 'sign': return toggleSign();
      case 'percent': return percent();
      case 'equals': return equals();
    }
  }

  keysEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) act(btn);
  });

  const KEY = {
    '+': '[data-op="add"]',
    '-': '[data-op="sub"]',
    '*': '[data-op="mul"]',
    'x': '[data-op="mul"]',
    '/': '[data-op="div"]',
    '.': '[data-action="dot"]',
    ',': '[data-action="dot"]',
    '%': '[data-action="percent"]',
    'Enter': '[data-action="equals"]',
    '=': '[data-action="equals"]',
    'Backspace': '[data-action="back"]',
    'Escape': '[data-action="clear"]',
    'Delete': '[data-action="clear"]'
  };

  window.addEventListener('keydown', (e) => {
    const selector = /^[0-9]$/.test(e.key) ? `[data-value="${e.key}"]` : KEY[e.key];
    if (!selector) return;
    e.preventDefault();
    const btn = keysEl.querySelector(selector);
    if (!btn) return;
    btn.classList.add('active');
    setTimeout(() => btn.classList.remove('active'), 120);
    act(btn);
  });

  render();
</script>
</body>
</html>
